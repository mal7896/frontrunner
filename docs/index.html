<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A presidential campaign game. Run the 2028 race or replay elections from 1948 to 2000 with the real candidates, from Labor Day to Election Night.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111316'/%3E%3Cellipse cx='32' cy='32' rx='19' ry='12' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M16 34c8-6 22-8 32-4' stroke='%23d5544d' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Front Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&display=swap">
<style>
/* Layout: an official ballot on a cool desk. Decisions are ballot contests you mark with an oval; the press answers in newspaper clippings; the map and the race tally sit beside them. */
:root {
  --page: #E6E8EB; --sheet: #FFFFFF; --sheet-2: #F3F4F6; --sheet-3: #EBEDF0;
  --ink: #111316; --ink-2: #3A3F46; --muted: #687078; --rule: #D5D9DE; --rule-2: #BFC4CA;
  --bar: #111316; --on-bar: #FFFFFF; --on-bar-2: #A9AFB7;
  --memo: #F2EADA; --memo-rule: #E1D4B8;
  --dem: #1D4FC0; --rep: #C4272B; --dem-2: #7FA2EA; --rep-2: #EE8C86;
  --d1: #C9D8F5; --d2: #8FAEEA; --d3: #4776D8; --d4: #1B44A8;
  --r1: #F6CDC9; --r2: #EC9690; --r3: #D5544D; --r4: #A3221F;
  --ind: #7340AE; --t1: #E6DAF3; --t2: #C3A6E4; --t3: #9467CC; --t4: #66369F;
  --toss: #D8D2BF; --land: #D3D7DC; --none: #EEF0F2; --locked: #A59F8C; --stroke: #FFFFFF; --lbA: #111316; --lbB: #FFFFFF;
  --pos: #15803D; --neg: #C2410C; --pencil: #2B2D31;
  --shadow: 0 1px 1px rgba(17, 19, 22, .04), 0 6px 18px rgba(17, 19, 22, .07);
  --f-sans: 'Libre Franklin', 'Franklin Gothic Medium', 'Helvetica Neue', Arial, sans-serif;
  --f-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0B0C0E; --sheet: #16181B; --sheet-2: #1C1F23; --sheet-3: #23272C;
    --ink: #EDEEF0; --ink-2: #C3C7CC; --muted: #8C9299; --rule: #2B2F35; --rule-2: #3A3F46;
    --bar: #000000; --on-bar: #F1F2F3; --on-bar-2: #8C9299;
    --memo: #26221A; --memo-rule: #3A3326;
    --dem: #5B8CF0; --rep: #EF6A62; --dem-2: #8DB0F5; --rep-2: #F49A94;
    --d1: #263A63; --d2: #3257A4; --d3: #4F84E6; --d4: #8AB0F7;
    --r1: #5A272A; --r2: #993631; --r3: #DD5A51; --r4: #F6958D;
    --ind: #B48CF0; --t1: #35284D; --t2: #5A3F8A; --t3: #9A72DC; --t4: #C7A9F5;
    --toss: #575240; --land: #262A31; --none: #1A1C20; --locked: #6E6956; --stroke: #0B0C0E; --lbA: #EDEEF0; --lbB: #0B0C0E;
    --pos: #4ADE80; --neg: #FB923C; --pencil: #D9DBDF;
    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0B0C0E; --sheet: #16181B; --sheet-2: #1C1F23; --sheet-3: #23272C;
  --ink: #EDEEF0; --ink-2: #C3C7CC; --muted: #8C9299; --rule: #2B2F35; --rule-2: #3A3F46;
  --bar: #000000; --on-bar: #F1F2F3; --on-bar-2: #8C9299;
  --memo: #26221A; --memo-rule: #3A3326;
  --dem: #5B8CF0; --rep: #EF6A62; --dem-2: #8DB0F5; --rep-2: #F49A94;
  --d1: #263A63; --d2: #3257A4; --d3: #4F84E6; --d4: #8AB0F7;
  --r1: #5A272A; --r2: #993631; --r3: #DD5A51; --r4: #F6958D;
  --ind: #B48CF0; --t1: #35284D; --t2: #5A3F8A; --t3: #9A72DC; --t4: #C7A9F5;
  --toss: #575240; --land: #262A31; --none: #1A1C20; --locked: #6E6956; --stroke: #0B0C0E; --lbA: #EDEEF0; --lbB: #0B0C0E;
  --pos: #4ADE80; --neg: #FB923C; --pencil: #D9DBDF;
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--page); }
body { margin: 0; color: var(--ink); font: 400 15px/1.55 var(--f-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bar); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font: 700 11px/1.2 var(--f-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
.c-D { color: var(--dem); } .c-R { color: var(--rep); } .c-T { color: var(--ind); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); }
.serif { font-family: var(--f-serif); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 4px; padding: 11px 18px; font: 700 14.5px/1.2 var(--f-sans); cursor: pointer; transition: background .15s, color .15s, transform .08s; text-align: center; }
.btn:hover:not(:disabled) { background: var(--sheet-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-ink { background: var(--ink); color: var(--sheet); }
.btn-ink:hover:not(:disabled) { background: var(--ink-2); }
.btn-lg { padding: 14px 22px; font-size: 15.5px; }
.kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--rule-2); font: 600 11px/1 var(--f-sans); color: var(--muted); background: var(--sheet); }

/* campaign-button avatar */
.pin { --c: var(--dem); flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; position: relative; color: #fff;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 46%), var(--c);
  box-shadow: inset 0 0 0 3px var(--c), inset 0 0 0 4.5px rgba(255, 255, 255, .85), 0 1px 2px rgba(0, 0, 0, .25); font: 900 14px/1 var(--f-sans); letter-spacing: .02em; }
.pin.p-R { --c: var(--rep); } .pin.p-T { --c: var(--ind); }
.pin.lg { width: 64px; height: 64px; font-size: 18px; box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 6px rgba(255, 255, 255, .85), 0 2px 4px rgba(0, 0, 0, .25); }
.pin.i3 { font-size: 12px; letter-spacing: -.02em; }
.pin.sm.i3 { font-size: 9px; }
.pin.lg.i3 { font-size: 16px; }
.pin.sm { width: 34px; height: 34px; font-size: 11px; box-shadow: inset 0 0 0 2px var(--c), inset 0 0 0 3.5px rgba(255, 255, 255, .85), 0 1px 2px rgba(0, 0, 0, .25); }

/* ballot */
.ballot { background: var(--sheet); border: 2px solid var(--ink); border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; }
.ballot-hd { background: var(--bar); color: var(--on-bar); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 16px; font: 700 11.5px/1.2 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; }
.ballot-hd span:last-child { color: var(--on-bar-2); }
.ballot-sub { border-bottom: 1px solid var(--ink); padding: 7px 16px; font: 700 11px/1.2 var(--f-sans); letter-spacing: .09em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; background: var(--sheet-2); }
.ballot-sub span:last-child { color: var(--muted); }
.choices { display: grid; }
.choice { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px; cursor: pointer; font: 600 15.5px/1.4 var(--f-sans); transition: background .12s; }
.choice:last-child { border-bottom: 0; }
.choice:hover { background: var(--sheet-2); }
.choice small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; margin-top: 2px; }
.oval { width: 30px; height: 18px; border: 2px solid var(--ink); border-radius: 50%; position: relative; display: block; flex: none; }
.oval svg { position: absolute; inset: -3px -2px; width: calc(100% + 4px); height: calc(100% + 6px); overflow: visible; }
.oval path { fill: none; stroke: var(--pencil); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 101 400; stroke-dashoffset: 101; transition: stroke-dashoffset .32s cubic-bezier(.4, .1, .3, 1); }
.choice:hover .oval path, .row-pick:hover .oval path, .card-pick:hover .oval path { stroke-dashoffset: 88; }
.choice.marked .oval path, .row-pick.marked .oval path, .card-pick.on .oval path { stroke-dashoffset: 0; }
.choice .kbd { opacity: .9; }
.instr { padding: 9px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--ink); background: var(--sheet-2); }

/* ===== title ===== */
.tmast { background: var(--bar); color: var(--on-bar); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.tmast .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 12px; font: 700 11.5px/1.2 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--on-bar-2); }
.tmast b { color: var(--on-bar); }
.title-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 48px; padding-block: 44px 36px; align-items: start; }
.wordmark { font: 900 clamp(60px, 8.6vw, 124px)/.84 var(--f-sans); letter-spacing: -.045em; text-transform: uppercase; }
.wordmark span { display: block; }
.wordmark .u { color: var(--dem); } .wordmark .v { color: var(--rep); }
.title-lede { font: 400 clamp(19px, 1.9vw, 23px)/1.45 var(--f-serif); margin-top: 26px; max-width: 32ch; color: var(--ink-2); }
.title-lede em { font-style: italic; }
.title-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 28px; font-size: 13px; color: var(--muted); }
.title-meta b { color: var(--ink); font-weight: 700; }
.title-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.tballot .row-pick { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 16px; cursor: pointer; transition: background .12s; position: relative; }
.tballot .row-pick:hover, .tballot .row-pick.peek { background: var(--sheet-2); }
.tballot .row-pick.peek::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ink); }
.tballot .row-pick:last-child { border-bottom: 0; }
.rp-main { min-width: 0; display: grid; gap: 2px; }
.rp-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rp-yr { font: 900 22px/1 var(--f-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rp-who { font: 700 14.5px/1.3 var(--f-sans); }
.rp-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }
.rp-pins { display: flex; }
.rp-pins .pin { margin-left: -8px; }
.title-strip { border-top: 1px solid var(--rule-2); padding-block: 22px 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.title-strip h3 { font: 800 15px/1.2 var(--f-sans); margin-bottom: 6px; }
.title-strip p { font-size: 13.5px; color: var(--muted); }

/* ===== setup ===== */
.topbar { background: var(--bar); color: var(--on-bar); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; min-height: 56px; }
.wm-sm { font: 900 18px/1 var(--f-sans); letter-spacing: -.03em; text-transform: uppercase; white-space: nowrap; }
.topbar .btn { color: var(--on-bar); border-color: #3B4048; padding: 7px 12px; font-size: 13px; }
.topbar .btn:hover:not(:disabled) { background: #22262B; }
.setup { padding-block: 32px 140px; display: grid; gap: 40px; max-width: 1100px; }
.step-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.step-h h2 { font: 900 clamp(24px, 3vw, 32px)/1.05 var(--f-sans); letter-spacing: -.02em; }
.step-h .n { font: 700 13px/1 var(--f-sans); color: var(--muted); letter-spacing: .08em; }
.step-h p { color: var(--muted); font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card-pick { text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 6px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color .15s, box-shadow .15s; position: relative; }
.card-pick:hover { border-color: var(--rule-2); box-shadow: var(--shadow); }
.card-pick.on { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); }
.card-pick .oval { position: absolute; top: 18px; right: 18px; }
.who { display: flex; align-items: center; gap: 14px; padding-right: 40px; }
.who b { display: block; font: 800 19px/1.15 var(--f-sans); letter-spacing: -.01em; }
.who .wt { min-width: 0; }
.who .ws { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.card-pick p { font-size: 14px; color: var(--ink-2); }
.perk { align-self: flex-start; font-size: 12.5px; font-weight: 700; padding: 4px 9px; border-radius: 3px; background: var(--sheet-3); }
.party-pick { padding: 22px; border-top: 6px solid var(--dem); }
.party-pick.p-R { border-top-color: var(--rep); }
.party-pick b { font: 900 clamp(22px, 2.6vw, 28px)/1 var(--f-sans); letter-spacing: -.02em; }
.party-pick.p-D b { color: var(--dem); } .party-pick.p-R b { color: var(--rep); }
.startbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--sheet); border-top: 1px solid var(--rule); box-shadow: 0 -8px 24px rgba(0, 0, 0, .08); padding-bottom: env(safe-area-inset-bottom, 0px); }
.startbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.startbar .sum { min-width: 0; font-size: 13.5px; color: var(--muted); }
.startbar .sum b { display: block; color: var(--ink); font: 800 17px/1.2 var(--f-sans); }
.brief { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.brief-text { font: 400 19px/1.55 var(--f-serif); color: var(--ink-2); }
.note-box { border-left: 3px solid var(--ink); padding: 4px 0 4px 16px; font-size: 14px; color: var(--ink-2); display: grid; gap: 6px; }
.note-box b { color: var(--ink); }

/* ===== game header ===== */
.ghead .wrap { gap: 18px; }
.ticket { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ticket .names { font: 800 14px/1.15 var(--f-sans); white-space: nowrap; }
.ticket .names span { display: block; font-weight: 500; font-size: 12px; color: var(--on-bar-2); }
.cal { flex: 1; min-width: 0; display: grid; gap: 6px; }
.cal .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--on-bar-2); white-space: nowrap; }
.cal .lbl b { color: var(--on-bar); font-weight: 700; }
.ticks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.ticks i { height: 5px; background: #2C3036; border-radius: 1px; }
.ticks i.done { background: var(--on-bar-2); }
.ticks i.now { background: var(--on-bar); }
.ticks i.g { background: var(--pos); } .ticks i.b { background: var(--neg); }

/* ===== game layout ===== */
.game { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(360px, 1fr); grid-template-areas: "race act" "map act" "keys act"; gap: 16px; padding-block: 16px 48px; align-items: start; }
.race { grid-area: race; padding: 16px 18px; }
.mapcard { grid-area: map; padding: 14px 16px 12px; position: relative; min-width: 0; }
.keys { grid-area: keys; padding: 16px 18px; }
.act { grid-area: act; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); min-width: 0; display: grid; gap: 14px; }

.race-top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; }
.side-tally { display: flex; align-items: center; gap: 12px; min-width: 0; }
.side-tally.r { flex-direction: row-reverse; text-align: right; }
.side-tally .ev { font: 900 clamp(36px, 4vw, 52px)/.9 var(--f-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.side-tally .nm { font: 700 13.5px/1.2 var(--f-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-tally .nm span { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.wincol { text-align: center; display: grid; justify-items: center; gap: 2px; }
.wincol .wc { font: 900 26px/1 var(--f-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.wincol .l { font-size: 11px; color: var(--muted); white-space: nowrap; }
.spark { width: 96px; height: 26px; display: block; }
.spark .ln { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spark .mid { stroke: var(--rule-2); stroke-width: 1; stroke-dasharray: 2 2; }
.evbar { position: relative; margin-top: 14px; }
.evtrack { display: flex; height: 16px; overflow: hidden; background: var(--toss); border-radius: 2px; }
.evtrack i { height: 100%; transition: width .5s ease; }
.evmark { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); }
.evmark span { position: absolute; top: auto; bottom: -17px; left: 50%; transform: translateX(-50%); font: 700 10px/1 var(--f-sans); letter-spacing: .06em; white-space: nowrap; }
.race-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.race-foot b { color: var(--ink); }

.usmap { width: 100%; height: auto; display: block; }
.usmap path { fill: var(--land); stroke: var(--stroke); stroke-width: .9; stroke-linejoin: round; transition: fill .5s ease; }
.usmap .box rect { fill: var(--land); stroke: var(--stroke); stroke-width: 1; transition: fill .5s ease; }
.usmap.live path, .usmap.live .box { cursor: pointer; }
.usmap.live path:hover, .usmap.live .box:hover rect { filter: brightness(.88); }
.usmap path.sel, .usmap .box.sel rect { stroke: var(--ink); stroke-width: 3; }
.usmap path.flash, .usmap .box.flash rect { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { filter: brightness(1.6); } 100% { filter: none; } }
.usmap text { pointer-events: none; }
.usmap .lb { font: 800 11.5px/1 var(--f-sans); text-anchor: middle; fill: var(--lbA); }
.usmap .lbe { font: 500 9.5px/1 var(--f-sans); text-anchor: middle; fill: var(--lbA); opacity: .85; }
.usmap .box text { font: 800 11px/1 var(--f-sans); fill: var(--lbA); }
.usmap .box text.ev { font-weight: 500; }
.usmap text.strong { fill: var(--lbB); }
.usmap text.gone { opacity: .35; }
.usmap .boxhd { font: 700 8.5px/1 var(--f-sans); fill: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.usmap .pin-me { fill: var(--ink); stroke: var(--sheet); stroke-width: 2; }
.usmap .pin-op { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; }
.maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.maphead h2 { font: 800 15px/1.2 var(--f-sans); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend .ramp { display: inline-flex; gap: 1px; vertical-align: -1px; margin-right: 6px; }
.legend .ramp i { width: 12px; height: 10px; display: inline-block; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--bar); color: var(--on-bar); border-radius: 4px; padding: 10px 12px; font-size: 12.5px; min-width: 190px; max-width: 260px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.tip b { display: block; font-size: 14.5px; margin-bottom: 4px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; }
.tip .row span:first-child { color: var(--on-bar-2); }
.tip .c-D { color: var(--dem-2); } .tip .c-R { color: var(--rep-2); } .tip .c-T { color: var(--t2); }
.tip p { color: var(--on-bar-2); margin-top: 6px; font-size: 11.5px; line-height: 1.4; }

.keys h2 { font: 800 15px/1.2 var(--f-sans); margin-bottom: 8px; }
.keylist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.krow { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; gap: 8px; align-items: center; font-size: 14px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%; }
.krow:hover .kn { text-decoration: underline; text-underline-offset: 3px; }
.krow .kn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.krow .kn small { color: var(--muted); font-size: 12px; margin-left: 2px; }
.lead { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.krow .ch { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--pos); } .down { color: var(--neg); }
.hint { font-size: 12.5px; color: var(--muted); }

/* ===== decision card parts ===== */
.dec-body { padding: 18px 16px 16px; display: grid; gap: 14px; }
.dec-body h2 { font: 900 clamp(24px, 2.3vw, 30px)/1.05 var(--f-sans); letter-spacing: -.025em; }
.dec-body .lede { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); }
.staff { display: grid; gap: 8px; }
.memo { background: var(--memo); border: 1px solid var(--memo-rule); border-radius: 3px; padding: 10px 12px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.memo .face { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--sheet); display: grid; place-items: center; font: 800 11px/1 var(--f-sans); }
.memo q { display: block; font: italic 400 15.5px/1.4 var(--f-serif); quotes: "\201C" "\201D"; }
.memo .by { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; font-weight: 600; }
.lastweek { font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; border-left: 3px solid var(--rule-2); padding-left: 12px; }
.lastweek b { color: var(--ink); }
.debate-vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.debate-vs .dv { display: flex; align-items: center; gap: 10px; min-width: 0; }
.debate-vs .dv.r { flex-direction: row-reverse; text-align: right; }
.debate-vs b { font: 800 15px/1.2 var(--f-sans); display: block; }
.debate-vs .dv > div span { font-size: 12px; color: var(--muted); }
.debate-vs .x { font: 900 13px/1 var(--f-sans); color: var(--muted); letter-spacing: .1em; }
.qbox { font: 400 19px/1.45 var(--f-serif); border-left: 3px solid var(--ink); padding: 2px 0 2px 14px; }
.qbox small { display: block; font: 700 11px/1.2 var(--f-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

/* clipping */
.clip { background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 14px 18px 16px; position: relative; border-radius: 2px; }
.clip .mast { display: flex; justify-content: space-between; gap: 10px; border-bottom: 3px double var(--ink); padding-bottom: 6px; margin-bottom: 10px; font: 700 10.5px/1.2 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; }
.clip .mast span:first-child { font: 700 15px/1 var(--f-serif); letter-spacing: 0; text-transform: none; }
.clip .mast span:last-child { color: var(--muted); align-self: end; }
.clip h3 { font: 700 clamp(22px, 2.2vw, 27px)/1.12 var(--f-serif); letter-spacing: -.01em; }
.clip .deck { font: italic 400 15.5px/1.45 var(--f-serif); color: var(--ink-2); margin-top: 8px; }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.verdict .tag { font: 800 11px/1 var(--f-sans); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 2px; background: var(--ink); color: var(--sheet); }
.verdict .tag.good { background: var(--pos); color: #fff; } .verdict .tag.bad { background: var(--neg); color: #fff; }
.chip { font-size: 12.5px; font-weight: 700; padding: 4px 8px; border-radius: 2px; border: 1px solid var(--rule); background: var(--sheet); }
.chip.up { color: var(--pos); } .chip.down { color: var(--neg); }
.voices { display: grid; gap: 10px; }
.voice { display: grid; gap: 3px; }
.voice q { font: italic 400 16.5px/1.4 var(--f-serif); quotes: "\201C" "\201D"; }
.voice span { font-size: 12px; color: var(--muted); }
.voice span b { color: var(--ink-2); font-weight: 700; }
.swing { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; border-block: 1px solid var(--rule); padding: 10px 0; }
.swing .big { font: 900 30px/1 var(--f-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.swing .arr { color: var(--muted); font-size: 18px; }
.swing span.s { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.history { border: 1.5px solid var(--ink); border-radius: 3px; padding: 12px 14px; display: grid; gap: 6px; background: var(--sheet-2); }
.history b { font: 800 11px/1.2 var(--f-sans); letter-spacing: .09em; text-transform: uppercase; }
.history p { font-size: 14px; color: var(--ink-2); }
.history .same { font-weight: 700; color: var(--ink); }
.snap { display: grid; gap: 8px; }
.snaprow { display: grid; grid-template-columns: 92px 1fr 42px; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 700; }
.snaprow .bar { height: 18px; background: var(--sheet-3); overflow: hidden; border-radius: 2px; }
.snaprow .bar i { display: block; height: 100%; width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.snaprow .v { text-align: right; font-variant-numeric: tabular-nums; }
.stops-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stops-h h3 { font: 900 18px/1.1 var(--f-sans); letter-spacing: -.01em; }
.stops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stop { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 4px; padding: 10px; cursor: pointer; min-width: 0; transition: border-color .12s, background .12s; }
.stop:hover { border-color: var(--ink); background: var(--sheet-2); }
.stop.mine { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); }
.stop svg { width: 40px; height: 32px; display: block; }
.stop svg path { fill: var(--ink-2); }
.stop .st { display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 800 14.5px/1.2 var(--f-sans); min-width: 0; }
.stop .st span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop .sd { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin-top: 2px; }

/* ===== night (always a dark studio) ===== */
.studio { --page: #0A0B0D; --sheet: #131518; --sheet-2: #191C20; --sheet-3: #22262B; --ink: #EEF0F2; --ink-2: #C5C9CE; --muted: #8A9098; --rule: #262A30; --rule-2: #353A41;
  --d1: #263A63; --d2: #3257A4; --d3: #4F84E6; --d4: #8AB0F7; --r1: #5A272A; --r2: #993631; --r3: #DD5A51; --r4: #F6958D;
  --toss: #4E4A3B; --land: #23272D; --none: #16181B; --locked: #6E6956; --stroke: #0A0B0D; --lbA: #EEF0F2; --lbB: #0A0B0D; --dem: #5B8CF0; --rep: #EF6A62;
  background: var(--page); color: var(--ink); min-height: 100vh; color-scheme: dark; }
.nhead { background: #000; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; border-bottom: 1px solid var(--rule); }
.nhead .wrap { padding-block: 14px 14px; display: grid; gap: 12px; }
.nrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.ncand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.ncand.r { flex-direction: row-reverse; text-align: right; }
.ncand .nev { font: 900 clamp(42px, 6vw, 72px)/.85 var(--f-sans); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ncand b { font: 800 16px/1.2 var(--f-sans); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ncand .np { font-size: 12px; color: var(--muted); }
.nclock { text-align: center; }
.nclock .t { font: 800 clamp(20px, 2.6vw, 28px)/1 var(--f-sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.nclock .k { font: 700 10.5px/1.2 var(--f-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ntrack { position: relative; height: 12px; background: var(--sheet-3); overflow: hidden; border-radius: 1px; }
.ntrack i { position: absolute; top: 0; bottom: 0; transition: width .35s; }
.ntrack .m { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; }
.nctrl { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.nctrl button { background: transparent; border: 1.5px solid var(--rule-2); color: var(--ink); padding: 7px 13px; border-radius: 3px; font: 700 13px/1.2 var(--f-sans); cursor: pointer; }
.nctrl button:hover { border-color: var(--ink); }
.nctrl button.on { background: var(--ink); color: #000; border-color: var(--ink); }
.nctrl button.go { background: #fff; color: #000; border-color: #fff; padding-inline: 18px; }
.ngrid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 16px; padding-block: 16px 48px; align-items: start; }
.nmap { padding: 14px 16px; min-width: 0; position: relative; }
.nside { display: grid; gap: 14px; min-width: 0; }
.npanel { padding: 14px 16px; }
.npanel h2 { font: 800 14px/1.2 var(--f-sans); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.npanel h2 span { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.bg-row { display: grid; grid-template-columns: minmax(0, 1fr) 62px 104px; gap: 8px; align-items: center; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.bg-row:last-child { border-bottom: 0; }
.bg-row .cnt { font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.bg-row .stt { text-align: right; }
.pill { display: inline-block; font: 800 11px/1 var(--f-sans); padding: 5px 7px; border-radius: 2px; white-space: nowrap; }
.pill.D { background: var(--dem); color: #fff; } .pill.R { background: var(--rep); color: #fff; } .pill.T { background: var(--ind); color: #fff; }
.pill.wait { color: var(--muted); border: 1px solid var(--rule-2); }
.pill.count { background: var(--sheet-3); color: var(--ink); }
.pill.close { background: transparent; color: var(--ink); border: 1px solid var(--ink); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.feed { display: grid; max-height: 340px; overflow-y: auto; }
.frow { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--rule); animation: slidein .35s ease-out; }
.frow .ft { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
@keyframes slidein { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
.l3slot { margin-bottom: 10px; display: grid; grid-template-rows: minmax(58px, auto); }
.l3idle { border: 1px dashed var(--rule-2); border-radius: 2px; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; }
.lower3 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; background: #000; color: #fff; border-radius: 2px; overflow: hidden; box-shadow: 0 12px 34px rgba(0, 0, 0, .55); animation: l3in .4s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
.lower3 .k { background: #fff; color: #000; font: 900 11px/1.2 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; padding: 0 12px; display: grid; place-items: center; }
.lower3 .m { padding: 10px 14px; min-width: 0; }
.lower3 .m b { display: block; font: 900 22px/1.05 var(--f-sans); letter-spacing: -.01em; }
.lower3 .m span { font-size: 12.5px; color: #B9BEC4; }
.lower3 .c { display: grid; place-items: center; padding: 0 16px; font: 900 15px/1 var(--f-sans); text-transform: uppercase; letter-spacing: .04em; }
.lower3.p-D .c { background: var(--dem); } .lower3.p-R .c { background: var(--rep); } .lower3.p-T .c { background: var(--ind); }
@keyframes l3in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.banner { padding: 16px 18px; color: #fff; display: grid; gap: 4px; margin-bottom: 12px; animation: pop .45s ease-out; border-radius: 2px; }
.banner.p-D { background: var(--dem); } .banner.p-R { background: var(--rep); } .banner.p-T { background: var(--ind); } .banner.p-X { background: #2A2E34; }
.banner .k { font: 800 11px/1.2 var(--f-sans); letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.banner b { font: 900 clamp(22px, 3vw, 32px)/1.02 var(--f-sans); letter-spacing: -.02em; }
@keyframes pop { from { transform: scale(.98); opacity: .4; } to { transform: none; opacity: 1; } }

/* ===== front page ===== */
.front { max-width: 1120px; margin: 24px auto 0; background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 22px 30px 30px; }
.fp-mast { text-align: center; border-bottom: 4px double var(--ink); padding-bottom: 10px; }
.fp-mast .nm { font: 700 clamp(30px, 4.6vw, 54px)/1 var(--f-serif); letter-spacing: -.01em; }
.fp-meta { display: flex; justify-content: space-between; gap: 10px; font: 700 10.5px/1.2 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 7px 0; border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
.fp-hl { font: 900 clamp(46px, 8.4vw, 112px)/.9 var(--f-sans); letter-spacing: -.045em; text-transform: uppercase; text-align: center; margin: 22px 0 12px; }
.fp-deck { font: italic 400 clamp(17px, 2vw, 22px)/1.4 var(--f-serif); text-align: center; max-width: 52ch; margin: 0 auto; color: var(--ink-2); }
.fp-score { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--ink); margin: 22px 0; }
.fp-score div { padding: 12px 14px; border-right: 1px solid var(--rule); display: grid; gap: 2px; }
.fp-score div:last-child { border-right: 0; }
.fp-score b { font: 900 clamp(30px, 4vw, 46px)/.95 var(--f-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.fp-score span { font-size: 12px; color: var(--muted); }
.fp-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.fp-col { display: grid; gap: 14px; min-width: 0; }
.fp-col h3 { font: 800 12px/1.2 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.fp-caption { font: italic 400 14px/1.45 var(--f-serif); color: var(--ink-2); }
.fp-actions { max-width: 1120px; margin: 16px auto 48px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.diary { display: grid; }
.drow { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.drow:last-child { border-bottom: 0; }
.drow .dd { font: 700 11px/1.3 var(--f-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.drow b { display: block; font: 700 16px/1.25 var(--f-serif); }
.drow span.c { font-size: 12.5px; color: var(--muted); display: block; margin-top: 2px; }
.grade { font: 800 10.5px/1 var(--f-sans); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 2px; white-space: nowrap; border: 1px solid var(--rule-2); color: var(--muted); }
.grade.strong, .grade.good { color: var(--pos); border-color: currentColor; } .grade.hurt { color: var(--neg); border-color: currentColor; }
.grade.hist { color: var(--ink); border-color: var(--ink); }
.compare { border: 1.5px solid var(--ink); padding: 14px 16px; display: grid; gap: 10px; }
.compare .cmp { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 16px; font-size: 14px; align-items: baseline; }
.compare .cmp b { font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font: 700 10.5px/1.2 var(--f-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--ink); }
.tbl td { padding: 7px 4px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.tbl .n { text-align: right; white-space: nowrap; }
.tbl .evm { display: none; font-size: 12px; }

/* ===== modal & toast ===== */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(8, 9, 11, .62); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mcard { background: var(--sheet); border: 2px solid var(--ink); max-width: 620px; width: 100%; margin: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .4); animation: pop .2s ease-out; border-radius: 3px; overflow: hidden; }
.mcard .mb { padding: 22px 24px 24px; display: grid; gap: 14px; }
.mcard h2 { font: 900 26px/1.05 var(--f-sans); letter-spacing: -.02em; }
.mcard ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14.5px; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(22px + var(--tk, 0px) + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--sheet); padding: 11px 16px; border-radius: 3px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; max-width: min(560px, calc(100% - 32px)); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== responsive ===== */
@media (max-width: 1080px) {
  .game { grid-template-columns: minmax(0, 1fr); grid-template-areas: "race" "act" "map" "keys"; }
  .act { position: static; }
  .ngrid, .fp-grid, .brief { grid-template-columns: minmax(0, 1fr); }
  .title-grid { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 36px 28px; }
  .title-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  body { font-size: 14.5px; }
  .topbar .sub, .fp-meta span:nth-child(2) { display: none; }
  .ghead .wm-sm { display: none; }
  .startbar .btn { white-space: nowrap; padding: 12px 16px; font-size: 14.5px; }
  .startbar .sum b { font-size: 15.5px; }
  .cards, .cards.two, .cards.four, .title-strip { grid-template-columns: minmax(0, 1fr); }
  .topbar.ghead { position: static; }
  .ghead .wrap { flex-wrap: wrap; gap: 10px; }
  .cal { order: 3; flex-basis: 100%; }
  .ghead .btn { margin-left: auto; }
  .keylist { grid-template-columns: minmax(0, 1fr); }
  .stops { grid-template-columns: minmax(0, 1fr); }
  .side-tally { flex-direction: column; align-items: flex-start; gap: 6px; }
  .side-tally.r { flex-direction: column; align-items: flex-end; }
  .side-tally .pin { display: none; }

let GF = 0.5; // share of field-office strength that shows in the polls; all of it counts on Election Day

// ---------- basics ----------
function fullOn() { return !!(G && G.full); }

function moneyTxt(x) {

function vNorm() { if (!S.vN) { let t = 0; STATEWIDE.forEach(u => { t += u.votes; }); S.vN = 155 / t; } return S.vN; }

// ---------- what the full campaign adds to the vote model ----------

// ---------- applying a week's plan ----------

// ---------- computer-run campaigns ----------
// How a campaign sees each state: its own margin (or, for a third party, its own lead) plus some guesswork.
function aiViewF(p) {

}

// ---------- ending a week ----------

// ---------- round-by-round debates ----------

function aiStratF(q) { let b = 'pivot', bv = -Infinity; for (const k of Object.keys(STRATS_F)) { const v = q.fit[k] + gauss() * 0.15; if (v > bv) { bv = v; b = k; } } return b; }

function debateFullHTML(d) {
  const D = ensureDebate(d), P = G.party, rivals = debRivals(d);
  const done = D.round >= D.qs.length;
  const cur = D.qs[Math.min(D.round, D.qs.length - 1)];
  let h = `<div class="rounds">${D.qs.map((q, i) => { const r = D.results[i]; return `<span class="rd ${r ? (r.edge > 0.5 ? 'w' : r.edge < -0.5 ? 'l' : 'e') : i === D.round ? 'now' : ''}">Round ${i + 1}${r ? ' · ' + (r.edge > 0.5 ? 'won' : r.edge < -0.5 ? 'lost' : 'even') : ''}</span>`; }).join('')}</div>`;
  if (D.stage === 'choose' && !done) {
    h += `<div class="qbox"><small>Round ${D.round + 1} of ${D.qs.length} · ${esc(cur.name)}</small>${esc(cur.q)}</div>

      <div class="ballot-sub"><span>Your approach</span><span>Vote for one</span></div>
      <div class="choices">${Object.entries(STRATS_F).map(([k, s], i) => `<button class="choice" data-a="debPick" data-v="${k}">${ovalHTML()}<span>${esc(s.label)}<small>${esc(s.desc)}</small></span><span class="kbd">${i + 1}</span></button>`).join('')}</div>
      <p class="instr">Mark an oval, or press 1–4.</p></div>`;
  } else {
    const r = D.results[D.results.length - 1];
    const verdict = r.edge > 0.5 ? 'You won the round.' : r.edge < -0.5 ? 'You lost the round.' : 'The round was even.';
    h += `<div class="qbox"><small>Round ${D.results.length} · ${esc(r.q)}</small>${r.lines.map(l => `<span class="dline c-${l.p}">${esc(l.t)}</span>`).join('')}</div>
      <p class="lede" style="margin-top:12px"><b>${verdict}</b></p></div>
      <div class="choices"><button class="choice" data-a="debNext">${ovalHTML()}<span>${done ? 'See how the debate played' : 'Next question'}</span><span class="kbd">Enter</span></button></div></div>`;
  }
  return h;
}

}

      <div class="fp-actions"><button class="btn btn-ink btn-lg" data-a="again">Run this race again</button>${S.modern ? '' : others2.map(q => `<button class="btn btn-lg" data-a="otherSide" data-v="${q}">Play as ${esc(candOf(q).last)}</button>`).join('')}<button class="btn btn-lg" data-a="copy">Copy my result</button><button class="btn btn-lg" data-a="home">Choose another race</button></div></div>`;
  paintBy($('#map-final'), id => shadeSh(G.fsh[id], 1));

}
function shareText() {
  const R = G.result, P = G.party;
  if (isT()) { const n = R.goals.filter(Boolean).length; return `I ran as ${full(me())} in the ${S.year} presidential election in Front Runner and won ${f1(R.pv.T)}% of the vote and ${R.ev.T} electoral vote${R.ev.T === 1 ? '' : 's'} (${n} of ${R.goals.length} goals met). In real life he won ${f1(S.third.actual.pv)}%. ${candOf(R.winner).last} won the presidency.`; }

// ---------- routing & actions ----------
function nightWon() { const N = G.night; return isT() ? evalOutcome(finalOutcome()) === 1 : !!(N.winner && N.winner.p === G.party); }
function planOK(id) { return !!(G && G.full && G.phase === 'r' && U[id] && U[id].ev); }

}
function markThen(el, fn, ms) { if (el) el.classList.add('marked'); SFX.play('mark'); setTimeout(fn, calm() ? 60 : ms); }
const A = {

  },
  cont() { G = load(); UI.pick = null; route(); },
  home() { stopNight(); if (G) save(); G = null; UI.modal = null; route(); },
  help() { UI.modal = 'help'; renderModal(); },
  settings() { UI.modal = 'settings'; renderModal(); },
  close() { UI.modal = null; renderModal(); },
  menu() { UI.modal = 'menu'; renderModal(); },
  quit() { UI.modal = null; A.home(); },
  restart() { UI.modal = 'restart'; renderModal(); },
  doRestart() { UI.modal = null; wipe(); G = null; renderModal(); route(); },
  set(v, el) {
    const k = el.dataset.k; SET[k] = v === 'true' ? true : v === 'false' ? false : (k === 'pace' ? +v : v);

    if (G && G.screen === 'night') renderNight(true);
  },
  toggleMusic() { SET.music = !SET.music; saveSettings(); applySettings(); if (SET.music) Music.play(Music.want); syncMusicButtons(); },
  sParty(v) { SFX.play('mark'); if (UI.setup.party !== v) UI.setup = Object.assign(UI.setup, { party: v, cand: null, vp: null, opp: 'random' }); renderSetup(); },
  sCand(v) { SFX.play('mark'); UI.setup.cand = v; renderSetup(); },
  sVp(v) { SFX.play('mark'); UI.setup.vp = v; renderSetup(); },
  sOpp(v) { SFX.play('mark'); UI.setup.opp = v; renderSetup(); },
  sDiff(v) { SFX.play('mark'); UI.setup.diff = v; renderSetup(); },
  hSide(v) { if (!['D', 'R', 'T'].includes(v) || (v === 'T' && !HISTORY[UI.setup.scen].third)) return; SFX.play('mark'); UI.setup.party = v; renderHSetup(); },
  mapMode(v) { UI.mapMode = v === 'share' ? 'share' : 'lead'; SFX.play('tick'); renderMap(); },
  hMode(v) { SFX.play('mark'); UI.setup.hmode = v; renderHSetup(); },
  sDepth(v) { if (v !== 'quick' && v !== 'full') return; SFX.play('mark'); UI.setup.depth = v; SET.depth = v; saveSettings(); if (UI.setup.scen === '2028') renderSetup(); else renderHSetup(); },
  start() { const P = UI.setup; if (!P || !P.party || (P.scen === '2028' && (!P.cand || !P.vp))) return; newGame(P); UI.pick = null; route(); if (S.vehicle === 'train') SFX.play('whistle'); },
  ans(v, el) {
    if (UI.busy || G.phase !== 'q') return; UI.busy = true;

    }, 380);
  },
  visit(v) {
    if (!G || G.phase !== 'r' || !U[v] || UI.busy) return;
    const homeOf = c => U[c.home] ? c.home : null;
    const prevMe = G.last ? G.last.me : homeOf(me());
    const prevOp = G.last ? G.last.op : homeOf(isT() ? candOf('D') : foe()), prevOp2 = isT() ? (G.last ? G.last.op2 : homeOf(candOf('R'))) : null;
    visit(v); UI.pick = null; renderGame();
    const t = G.last; if (!t) return;
    const svg = $('#map-game'); const pins = svg && $('.pins', svg);
    SFX.play(S.vehicle === 'train' ? 'whistle' : S.vehicle === 'bus' ? 'horn' : 'whoosh');
    if (svg && !calm()) {
      if (pins) pins.style.opacity = '0';

    } else SFX.play('cheer', .5);
  },
  key(v) { if (G.phase === 'r') { UI.pick = v; renderAct(); } markSel($('#map-game'), v); },
  plUnpick() { UI.pick = null; renderAct(); markSel($('#map-game'), null); },
  plRally(v) { if (!planOK(v) || G.plan.cand.length >= FULL_SLOTS.cand) return; G.plan.cand.push({ t: 'rally', u: v }); planned(); },
  plVp(v) { if (!planOK(v) || G.plan.vp.length >= FULL_SLOTS.vp) return; G.plan.vp.push({ t: 'rally', u: v }); planned(); },
  plFund(v) { if (!planOK(v) || G.plan.cand.length >= FULL_SLOTS.cand || !DONOR_STATES.includes(U[v].state)) return; G.plan.cand.push({ t: 'fund', u: v }); planned(); },
  plPrep() { if (!G || !G.full || G.phase !== 'r' || !debateNextTurn() || G.plan.cand.length >= FULL_SLOTS.cand) return; G.plan.cand.push({ t: 'prep' }); planned(); },
  plAd(v) { const [id, s] = String(v).split('|'); const amt = +s; if (!planOK(id) || !(amt > 0) || planCost(G.plan) + amt > G.cash[G.party] + 1e-6) return; G.plan.ads[id] = (G.plan.ads[id] || 0) + amt; planned(); },
  plOff(v) { if (!planOK(v) || officesIn(G.party, v) >= 2 || planCost(G.plan) + officeCost(U[v]) > G.cash[G.party] + 1e-6) return; G.plan.off.push(v); planned(); },
  plDel(v) { if (!G || !G.full || G.phase !== 'r') return; const [who, i] = String(v).split('|'); if ((who === 'cand' || who === 'vp') && G.plan[who][+i]) { G.plan[who].splice(+i, 1); planned(true); } },
  plAdDel(v) { if (!G || !G.full || G.phase !== 'r') return; delete G.plan.ads[v]; planned(true); },
  plOffDel(v) { if (!G || !G.full || G.phase !== 'r') return; G.plan.off.splice(+v, 1); planned(true); },
  plAuto() { if (!G || !G.full || G.phase !== 'r') return; autoPlan(); SFX.play('paper'); renderAct(); save(); },
  plClear() { if (!G || !G.full || G.phase !== 'r') return; G.plan = emptyPlan(); planned(true); },
  endWeek() {
    if (!G || !G.full || G.phase !== 'r' || UI.busy) return;
    const homeOf = c => U[c.home] ? c.home : null;
    const prevMe = G.last ? G.last.me : homeOf(me());
    const prevOp = G.last ? G.last.op : homeOf(isT() ? candOf('D') : foe()), prevOp2 = isT() ? (G.last ? G.last.op2 : homeOf(candOf('R'))) : null;
    if (!endWeekFull()) return;
    UI.pick = null; renderGame();
    const t = G.last; const svg = $('#map-game'); const pins = svg && $('.pins', svg);
    SFX.play(S.vehicle === 'train' ? 'whistle' : S.vehicle === 'bus' ? 'horn' : 'whoosh');
    if (svg && !calm() && t) {
      if (pins) pins.style.opacity = '0';
      animateTravel(svg, prevOp, t.op, false);
      if (t.op2) animateTravel(svg, prevOp2, t.op2, false);
      animateTravel(svg, prevMe, t.me, true, () => { if (pins) pins.style.opacity = '1'; flashState(svg, t.me); SFX.play('cheer', .6); });
    } else SFX.play('cheer', .5);
  },
  debPick(v, el) {
    if (UI.busy || !G || !G.full || G.phase !== 'q' || !STRATS_F[v]) return; UI.busy = true;

  },
  debNext() {
    if (!G || !G.full || G.phase !== 'q' || !G.deb || G.deb.stage !== 'result') return;

    const a = $('#act'); if (a && window.innerWidth <= 1080) a.scrollIntoView({ behavior: calm() ? 'auto' : 'smooth', block: 'start' });
  },
  night() { startNight(); UI.speed = SET.pace; UI.l3 = []; route(); },
  speed(v) { UI.speed = +v; renderNight(true); },
  skip() { let g = 0; while (!G.night.done && g++ < 4000) nightStep(0.05); UI.l3 = []; $('#l3').dataset.s = 'i'; $('#l3').innerHTML = '<div class="l3idle">Every state has been called</div>'; save(); renderNight(true); },
  results() { stopNight(); computeResult(); G.screen = 'final'; save(); route(); },
  again() { const cfg = { scen: G.scen, party: G.party, cand: G.tk[G.party].c, vp: G.tk[G.party].v, opp: G.tk[G.opp].c, diff: G.diff, hmode: G.hmode, depth: G.full ? 'full' : 'quick' }; wipe(); newGame(cfg); UI.pick = null; route(); },
  otherSide(v) { const party = S.parties.includes(v) ? v : G.opp; const cfg = { scen: G.scen, party, hmode: G.hmode, depth: G.full ? 'full' : 'quick' }; wipe(); newGame(cfg); UI.pick = null; UI.mapMode = 'lead'; route(); },
  copy() {

  }
};
function syncMusicButtons() { $$('[data-a="toggleMusic"]').forEach(b => { b.textContent = SET.music ? 'Music on' : 'Music off'; b.setAttribute('aria-pressed', String(SET.music)); }); }
const unlockAll = () => { SFX.init(); try { if (SFX.ac && SFX.ac.state === 'suspended') SFX.ac.resume(); } catch (e) { } Music.unlock(); };
['pointerdown', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlockAll, true));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (e.target.id === 'modal') A.close(); return; }
  if (el.disabled) return;

});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
